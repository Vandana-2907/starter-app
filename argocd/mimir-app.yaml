apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Vandana-2907/starter-app.git
    targetRevision: 5.8.0
    path: Observability
    helm:
      valueFiles:
        - mimir-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true