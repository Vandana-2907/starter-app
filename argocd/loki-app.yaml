apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  destination:
    namespace: observability
    server: https://kubernetes.default.svc

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "*"
    helm:
      values: |
      deploymentMode: SingleBinary

      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem

    singleBinary:
      replicas: 1

    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

      

  syncPolicy:
    automated:
      prune: true
      selfHeal: true