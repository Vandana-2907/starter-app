apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Vandana-2907/starter-app.git
    targetRevision: 6.28.0
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    helm:
      values: |
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
        loki:
          storage:
            type: filesystem

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true